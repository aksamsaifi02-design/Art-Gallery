<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Art Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark gallery-navbar">
    <div class="container">
        <a href="../index.html" class="navbar-brand">Art<span>Gallery</span></a>
        <a href="../index.html" class="btn btn-outline-light btn-sm">Home</a>
    </div>
</nav>

<div class="auth-wrap">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="auth-card text-center">

                    <div class="auth-badge">&#9776;</div>
                    <h2 class="mb-1">Admin Login</h2>
                    <p class="text-muted mb-4">Manage artists, artworks and enquiries.</p>

                    <div id="loginMessage" class="text-start"></div>

                    <form id="adminLoginForm" class="text-start">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="adminEmail" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="adminPassword" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/admin.js"></script>
</body>
</html>
