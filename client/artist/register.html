<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Artist Registration - Art Gallery</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Artist Registration
                    </h2>

                    <form id="registerForm">

                        <!-- Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Artist Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- Phone -->

                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="text"
                                id="phone"
                                class="form-control"
                            >

                        </div>


                        <!-- WhatsApp -->

                        <div class="mb-3">

                            <label class="form-label">
                                WhatsApp
                            </label>

                            <input
                                type="text"
                                id="whatsapp"
                                class="form-control"
                            >

                        </div>


                        <!-- Instagram -->

                        <div class="mb-3">

                            <label class="form-label">
                                Instagram
                            </label>

                            <input
                                type="text"
                                id="instagram"
                                class="form-control"
                            >

                        </div>


                        <!-- Location -->

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                class="form-control"
                            >

                        </div>


                        <!-- Bio -->

                        <div class="mb-3">

                            <label class="form-label">
                                About You
                            </label>

                            <textarea
                                id="bio"
                                class="form-control"
                                rows="4">
                            </textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Register

                        </button>

                    </form>


                    <div
                        id="message"
                        class="mt-3">
                    </div>


                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="../js/artist.js"></script>

</body>

</html>
