<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Artwork - Art Gallery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

</head>

<body>

<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="dashboard.html">

            Art Gallery

        </a>

        <div>

            <a
                href="my-artworks.html"
                class="btn btn-outline-light">

                My Artworks

            </a>

        </div>

    </div>

</nav>


<!-- ==========================================
     EDIT FORM
========================================== -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="mb-4">
                        Edit Artwork
                    </h2>


                    <div id="editMessage"></div>


                    <form
                        id="editArtworkForm">


                        <!-- TITLE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Painting Name
                            </label>

                            <input
                                type="text"
                                name="title"
                                id="editTitle"
                                class="form-control"
                                required>

                        </div>


                        <!-- PRICE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Price (₹)
                            </label>

                            <input
                                type="number"
                                name="price"
                                id="editPrice"
                                class="form-control"
                                min="0"
                                step="0.01"
                                required>

                        </div>


                        <!-- CATEGORY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                name="category_id"
                                id="editCategory"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Category
                                </option>

                                <option value="1">
                                    Painting
                                </option>

                                <option value="2">
                                    Sketch
                                </option>

                                <option value="3">
                                    Digital Art
                                </option>

                                <option value="4">
                                    Portrait
                                </option>

                                <option value="5">
                                    Landscape
                                </option>

                                <option value="6">
                                    Abstract
                                </option>

                                <option value="7">
                                    Handmade
                                </option>

                            </select>

                        </div>


                        <!-- MEDIUM -->

                        <div class="mb-3">

                            <label class="form-label">
                                Medium
                            </label>

                            <input
                                type="text"
                                name="medium"
                                id="editMedium"
                                class="form-control">

                        </div>


                        <!-- DIMENSIONS -->

                        <div class="mb-3">

                            <label class="form-label">
                                Dimensions
                            </label>

                            <input
                                type="text"
                                name="dimensions"
                                id="editDimensions"
                                class="form-control">

                        </div>


                        <!-- LOCATION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                id="editLocation"
                                class="form-control">

                        </div>


                        <!-- AVAILABILITY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Availability
                            </label>

                            <select
                                name="availability"
                                id="editAvailability"
                                class="form-select">

                                <option value="Available">
                                    Available
                                </option>

                                <option value="Sold">
                                    Sold
                                </option>

                            </select>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                id="editDescription"
                                class="form-control"
                                rows="5"
                                required>
                            </textarea>

                        </div>


                        <!-- BUTTONS -->

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Update Artwork

                        </button>


                        <a
                            href="my-artworks.html"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="../js/artist.js"></script>

</body>

</html>
