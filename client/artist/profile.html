<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - Art Gallery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

</head>

<body>

<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="dashboard.html">

            Art Gallery

        </a>

        <div>

            <a
                href="dashboard.html"
                class="btn btn-outline-light">

                Dashboard

            </a>

        </div>

    </div>

</nav>


<!-- ==========================================
     PROFILE FORM
========================================== -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="mb-4">
                        My Profile
                    </h2>


                    <div id="profileMessage"></div>


                    <form
                        id="profileForm">


                        <!-- NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Artist Name
                            </label>

                            <input
                                type="text"
                                id="profileNameInput"
                                name="name"
                                class="form-control"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="profileEmailInput"
                                name="email"
                                class="form-control"
                                readonly>

                            <small class="text-muted">
                                Email cannot be changed here.
                            </small>

                        </div>


                        <!-- PHONE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="text"
                                id="profilePhoneInput"
                                name="phone"
                                class="form-control">

                        </div>


                        <!-- WHATSAPP -->

                        <div class="mb-3">

                            <label class="form-label">
                                WhatsApp
                            </label>

                            <input
                                type="text"
                                id="profileWhatsappInput"
                                name="whatsapp"
                                class="form-control">

                        </div>


                        <!-- INSTAGRAM -->

                        <div class="mb-3">

                            <label class="form-label">
                                Instagram
                            </label>

                            <input
                                type="text"
                                id="profileInstagramInput"
                                name="instagram"
                                class="form-control"
                                placeholder="@yourusername">

                        </div>


                        <!-- LOCATION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                id="profileLocationInput"
                                name="location"
                                class="form-control">

                        </div>


                        <!-- BIO -->

                        <div class="mb-3">

                            <label class="form-label">
                                About You / Artist Bio
                            </label>

                            <textarea
                                id="profileBioInput"
                                name="bio"
                                class="form-control"
                                rows="6"
                                placeholder="Tell viewers about yourself and your art...">
                            </textarea>

                        </div>


                        <!-- BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Update Profile

                        </button>


                        <a
                            href="dashboard.html"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="../js/artist.js"></script>

</body>

</html>
