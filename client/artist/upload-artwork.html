<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload Artwork - Art Gallery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="dashboard.html">

            Art Gallery

        </a>

        <a
            href="dashboard.html"
            class="btn btn-outline-light">

            Dashboard

        </a>

    </div>

</nav>


<!-- MAIN CONTENT -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="mb-4">
                        Upload Artwork
                    </h2>


                    <form
                        id="artworkForm"
                        enctype="multipart/form-data">


                        <!-- TITLE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Painting Name
                            </label>

                            <input
                                type="text"
                                name="title"
                                id="title"
                                class="form-control"
                                required>

                        </div>


                        <!-- IMAGE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Painting Image
                            </label>

                            <input
                                type="file"
                                name="image"
                                id="image"
                                class="form-control"
                                accept="image/*"
                                required>

                            <small class="text-muted">
                                JPG, JPEG, PNG or WEBP
                            </small>

                        </div>


                        <!-- PRICE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Price (₹)
                            </label>

                            <input
                                type="number"
                                name="price"
                                id="price"
                                class="form-control"
                                min="0"
                                step="0.01"
                                required>

                        </div>


                        <!-- CATEGORY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                name="category_id"
                                id="category_id"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Category
                                </option>

                                <option value="1">
                                    Painting
                                </option>

                                <option value="2">
                                    Sketch
                                </option>

                                <option value="3">
                                    Digital Art
                                </option>

                                <option value="4">
                                    Portrait
                                </option>

                                <option value="5">
                                    Landscape
                                </option>

                                <option value="6">
                                    Abstract
                                </option>

                                <option value="7">
                                    Handmade
                                </option>

                            </select>

                        </div>


                        <!-- MEDIUM -->

                        <div class="mb-3">

                            <label class="form-label">
                                Medium
                            </label>

                            <input
                                type="text"
                                name="medium"
                                id="medium"
                                class="form-control"
                                placeholder="Oil on canvas">

                        </div>


                        <!-- DIMENSIONS -->

                        <div class="mb-3">

                            <label class="form-label">
                                Dimensions
                            </label>

                            <input
                                type="text"
                                name="dimensions"
                                id="dimensions"
                                class="form-control"
                                placeholder="24 × 36 inches">

                        </div>


                        <!-- LOCATION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                id="location"
                                class="form-control">

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                id="description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe your artwork..."
                                required>
                            </textarea>

                        </div>


                        <!-- SUBMIT -->

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Upload Artwork

                        </button>

                        <a
                            href="dashboard.html"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>


                    <div
                        id="artworkMessage"
                        class="mt-4">
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="../js/artist.js"></script>

</body>

</html>
