<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Artwork Details - Art Gallery</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

    <style>

        .artwork-main-image {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            background-color: white;
            border-radius: 12px;
        }


        .detail-card {
            background-color: var(--gallery-paper);
            border-radius: var(--gallery-radius);
            padding: 25px;
            border: 1px solid var(--gallery-border);
        }


        .artist-card {
            background-color: var(--gallery-paper);
            border-radius: var(--gallery-radius);
            padding: 25px;
            border: 1px solid var(--gallery-border);
        }


        .price {
            font-size: 28px;
            font-weight: bold;
            color: var(--gallery-terracotta);
        }


        .detail-label {
            font-weight: bold;
        }

    </style>

</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar navbar-dark gallery-navbar">

    <div class="container">

        <a
            href="../index.html"
            class="navbar-brand">

            Art<span>Gallery</span>

        </a>


        <a
            href="gallery.html"
            class="btn btn-outline-light">

            Back to Gallery

        </a>

    </div>

</nav>



<!-- ==========================================
     MAIN CONTENT
========================================== -->

<div class="container mt-5">


    <!-- MESSAGE -->

    <div id="detailsMessage"></div>



    <!-- ========================================
         ARTWORK SECTION
    ========================================= -->

    <div
        id="artworkDetails"
        class="row g-4"
        style="display: none;">


        <!-- IMAGE -->

        <div class="col-lg-7">

            <div class="detail-card shadow-sm">

                <img
                    id="artworkImage"
                    src=""
                    alt="Artwork"
                    class="artwork-main-image">

            </div>

        </div>



        <!-- DETAILS -->

        <div class="col-lg-5">

            <div class="detail-card shadow-sm">

                <h1
                    id="artworkTitle"
                    class="mb-3">

                </h1>


                <div
                    id="artworkPrice"
                    class="price mb-4">

                </div>


                <p>

                    <span class="detail-label">
                        Artist:
                    </span>

                    <span id="artworkArtist">
                    </span>

                </p>


                <p>

                    <span class="detail-label">
                        Category:
                    </span>

                    <span id="artworkCategory">
                    </span>

                </p>


                <p>

                    <span class="detail-label">
                        Medium:
                    </span>

                    <span id="artworkMedium">
                    </span>

                </p>


                <p>

                    <span class="detail-label">
                        Dimensions:
                    </span>

                    <span id="artworkDimensions">
                    </span>

                </p>


                <p>

                    <span class="detail-label">
                        Location:
                    </span>

                    <span id="artworkLocation">
                    </span>

                </p>


                <p>

                    <span class="detail-label">
                        Availability:
                    </span>

                    <span id="artworkAvailability">
                    </span>

                </p>


                <hr>


                <h4>
                    About This Artwork
                </h4>


                <p
                    id="artworkDescription"
                    class="text-muted">

                </p>


                <button
                    id="contactArtistButton"
                    class="btn btn-primary w-100 mt-3">

                    Contact Artist

                </button>

            </div>

        </div>

    </div>



    <!-- ========================================
         ARTIST SECTION
    ========================================= -->

    <div
        id="artistDetails"
        class="artist-card shadow-sm mt-4"
        style="display: none;">

        <h2 class="mb-4">
            About the Artist
        </h2>


        <h4
            id="artistName">

        </h4>


        <p
            id="artistBio"
            class="text-muted">

        </p>


        <hr>


        <div class="row">


            <div class="col-md-6">

                <p>

                    <strong>
                        Email:
                    </strong>

                    <span id="artistEmail">
                    </span>

                </p>


                <p>

                    <strong>
                        Phone:
                    </strong>

                    <span id="artistPhone">
                    </span>

                </p>

            </div>


            <div class="col-md-6">

                <p>

                    <strong>
                        WhatsApp:
                    </strong>

                    <span id="artistWhatsapp">
                    </span>

                </p>


                <p>

                    <strong>
                        Instagram:
                    </strong>

                    <span id="artistInstagram">
                    </span>

                </p>

            </div>

        </div>

        <div id="whatsappLinkWrap" class="mt-3" style="display: none;">
            <a id="whatsappLink" href="#" target="_blank" rel="noopener" class="btn-whatsapp">
                &#128172; Chat on WhatsApp
            </a>
        </div>

    </div>


</div>

<script src="../js/viewer.js"></script>

</body>

</html>
