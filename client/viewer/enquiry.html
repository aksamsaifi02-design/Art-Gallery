<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Contact Artist - Art Gallery</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar navbar-dark gallery-navbar">

    <div class="container">

        <a
            href="../index.html"
            class="navbar-brand">

            Art<span>Gallery</span>

        </a>


        <a
            href="gallery.html"
            class="btn btn-outline-light">

            Back to Gallery

        </a>

    </div>

</nav>



<!-- ==========================================
     FORM
========================================== -->

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">


                    <h2 class="mb-2">

                        Contact Artist

                    </h2>


                    <p class="text-muted">

                        Interested in this artwork?
                        Send an enquiry to the artist.

                    </p>


                    <div id="enquiryMessage"></div>


                    <form
                        id="enquiryForm">


                        <!-- ARTWORK -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                Artwork

                            </label>


                            <input
                                type="text"
                                id="enquiryArtworkTitle"
                                class="form-control"
                                readonly>

                        </div>



                        <!-- BUYER NAME -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                Your Name

                            </label>


                            <input
                                type="text"
                                id="buyerName"
                                name="buyer_name"
                                class="form-control"
                                required>

                        </div>



                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                Email

                            </label>


                            <input
                                type="email"
                                id="buyerEmail"
                                name="buyer_email"
                                class="form-control"
                                required>

                        </div>



                        <!-- PHONE -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                Phone

                            </label>


                            <input
                                type="text"
                                id="buyerPhone"
                                name="buyer_phone"
                                class="form-control">

                        </div>



                        <!-- MESSAGE -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                Message

                            </label>


                            <textarea
                                id="buyerMessage"
                                name="message"
                                class="form-control"
                                rows="5"
                                placeholder="I am interested in purchasing this artwork..."></textarea>

                        </div>



                        <!-- SUBMIT -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Send Enquiry

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>



<script src="../js/viewer.js"></script>

</body>

</html>
